pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'SkillApp'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// ── Unity as a Library ───────────────────────────────────────────────────────
// Produced by: Unity.exe -executeMethod SkillApp.EditorTools.AndroidBuild.ExportAndroidLibrary
// The directory is generated and gitignored; run the export before building.
include ':unityLibrary'
project(':unityLibrary').projectDir = new File(rootProject.projectDir, '../unity/builds/android/unityLibrary')
